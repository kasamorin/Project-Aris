[project]
name = "aris"
version = "0.2.6"
description = "拟人 AI Aris —— 目标是社会学意义上的人"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "openai>=2.0",
    "httpx>=0.28",
    "prompt-toolkit>=3.0.53",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
    "tomli-w>=1.2.0",
]

[project.scripts]
aris = "aris.cli:main"

# 开发依赖（uv sync 默认安装 dev group；测试运行：uv run pytest）
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
