# 联网搜索模块配置（Bing 直连为主 + Tavily 兜底）

# 首选搜索引擎（"bing"/"tavily"/"auto"），另一个失败时自动兜底
# 定案：一律走 Bing 国际版（www.bing.com），Tavily 兜底
# auto = 按查询语言分流（含中文走 Tavily），仅在需要时切换
prefer_engine = "bing"

# HTTP 请求超时（秒）
timeout_seconds = 15.0

# 返回搜索结果条数
results_count = 5

# 摘要截断长度（字符，省 token）
snippet_max_len = 200

# web_open：抓取网页正文的超时（秒）
webopen_timeout_seconds = 20.0

# web_open：返回正文最大长度（字符，截断省 token）
webopen_max_chars = 4000
