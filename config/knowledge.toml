# knowledge 模块可调参数（优先级：代码内默认值 < 本文件）
# 详见 developDoc/KNOWLEDGE-BASE.md 第 5 节

# 总开关：false 时检索返回空、摄入直接拒绝
enabled = true

# 分块：标题层级切 + 定长兜底重叠（max_chars 为单块字符上限）
max_chars = 800
min_chars = 120
overlap_ratio = 0.15

# 检索
top_k = 5
ef_search = 40

# HNSW 建索引参数（先导数据、后建索引）
index_m = 16
index_ef_construction = 64

# WebUI 上传：落盘目录（空 = data/knowledge/，同名文件覆盖）
upload_dir = ""
max_file_bytes = 10485760   # 单文件 10MB
max_files_per_upload = 50
