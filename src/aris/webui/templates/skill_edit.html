{% extends "base.html" %}
{% block title %}编辑 {{ skill.name }} - Project-Aris{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <div>
        <a href="/skills/{{ skill.name }}" class="text-sm text-blue-600 hover:underline">← 返回详情</a>
        <h2 class="text-2xl font-semibold mt-1">编辑 {{ skill.name }}</h2>
    </div>
</div>

<form method="post" action="/skills/{{ skill.name }}/edit">
    <div class="grid grid-cols-2 gap-4">
        <!-- 左侧：编辑器 -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">SKILL.md 内容</label>
            <textarea name="content" id="editor"
                      class="w-full h-[500px] px-3 py-2 border border-gray-300 rounded-md font-mono text-sm
                             focus:outline-none focus:ring-2 focus:ring-blue-500"
                      oninput="updatePreview()">{{ skill.content }}</textarea>
        </div>
        <!-- 右侧：预览 -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">预览</label>
            <div id="preview" class="h-[500px] overflow-y-auto border border-gray-200 rounded-md p-4 bg-white">
            </div>
        </div>
    </div>
    <div class="mt-4 flex gap-2">
        <button type="submit"
                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">
            保存
        </button>
        <a href="/skills/{{ skill.name }}"
           class="px-4 py-2 bg-gray-200 rounded-md hover:bg-gray-300 text-sm">
            取消
        </a>
    </div>
</form>

<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script>
    // marked 输出必须经 DOMPurify 净化后再插入 DOM（SKILL.md 内容不可信）
    function renderSafe(md) {
        return DOMPurify.sanitize(marked.parse(md));
    }
    function updatePreview() {
        const content = document.getElementById('editor').value;
        document.getElementById('preview').innerHTML = renderSafe(content);
    }
    // 初始化预览
    updatePreview();
</script>
{% endblock %}
