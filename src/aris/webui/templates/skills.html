{% extends "base.html" %}
{% block title %}技能管理 - Project-Aris{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-semibold">技能管理</h2>
    <button class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">
        + 创建技能
    </button>
</div>

<div class="grid grid-cols-3 gap-4">
    {% for skill in skills %}
    <div class="bg-white rounded-lg shadow p-4 hover:shadow-md transition-shadow">
        <h3 class="font-medium mb-1">{{ skill.name }}</h3>
        <p class="text-sm text-gray-500 mb-3">{{ skill.description }}</p>
        <div class="flex gap-2">
            <a href="/skills/{{ skill.name }}" class="text-sm text-blue-600 hover:underline">查看</a>
            <a href="/skills/{{ skill.name }}/edit" class="text-sm text-gray-500 hover:underline">编辑</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
