{% extends "base.html" %}
{% block title %}审计流水 - Project-Aris{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-semibold">审计流水</h2>
    <button id="sse-toggle" class="px-3 py-1 text-sm bg-gray-200 rounded hover:bg-gray-300">
        ▶ 实时
    </button>
</div>

<!-- 筛选栏 -->
<div class="bg-white rounded-lg shadow p-4 mb-4 flex gap-4">
    <input type="date" class="px-3 py-1 border border-gray-300 rounded text-sm">
    <select class="px-3 py-1 border border-gray-300 rounded text-sm">
        <option value="">全部模块</option>
    </select>
    <select class="px-3 py-1 border border-gray-300 rounded text-sm">
        <option value="">全部操作</option>
    </select>
</div>

<!-- 表格 -->
<div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-4 py-2 text-left">时间</th>
                <th class="px-4 py-2 text-left">模块</th>
                <th class="px-4 py-2 text-left">操作</th>
                <th class="px-4 py-2 text-left">结果</th>
                <th class="px-4 py-2 text-left">详情</th>
            </tr>
        </thead>
        <tbody id="audit-body">
            {% for row in records %}
            <tr class="border-t border-gray-100">
                <td class="px-4 py-2 text-gray-500">{{ row.ts }}</td>
                <td class="px-4 py-2">{{ row.module }}</td>
                <td class="px-4 py-2">{{ row.action }}</td>
                <td class="px-4 py-2">
                    {% if row.result == 'success' %}
                    <span class="text-green-600">✓</span>
                    {% else %}
                    <span class="text-red-600">✗</span>
                    {% endif %}
                </td>
                <td class="px-4 py-2 text-gray-500">{{ row.detail }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
