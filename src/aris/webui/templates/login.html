<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Project-Aris WebUI</title>
    <script src="/static/uno.js"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-sm">
        <div class="bg-white rounded-lg shadow-md p-8">
            <h1 class="text-xl font-semibold text-center mb-6">Project-Aris</h1>

            {% if error %}
            <div class="bg-red-50 text-red-700 text-sm p-3 rounded mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/login">
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        密码
                    </label>
                    <input type="password" id="password" name="password"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md
                                  focus:outline-none focus:ring-2 focus:ring-blue-500"
                           required autofocus>
                </div>
                <button type="submit"
                        class="w-full bg-blue-600 text-white py-2 rounded-md
                               hover:bg-blue-700 transition-colors">
                    登录
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-gray-400 mt-4">
            仅限局域网/VPN 访问
        </p>
    </div>
</body>
</html>
